# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - dominoGravity

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # Do not set NODE_ENV=production here. npm ci omits workspace
      # devDependencies (typescript, vite, vitest, @types/*) when NODE_ENV is
      # production, which is what broke tsc after PR #4.
      - name: npm ci, build, and test
        env:
          VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Prune to production dependencies
        run: npm ci --omit=dev

      # The pruned ZIP has client/dist + server/dist + production node_modules,
      # but not tsconfig/sources. Azure OneDeploy/Oryx still runs `npm run build`
      # unless SCM_DO_BUILD_DURING_DEPLOYMENT=false. Rewrite only the uploaded
      # package.json so a stray Oryx build is a no-op and cannot invoke tsc.
      - name: Mark deploy artifact as prebuilt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text())
          pkg["scripts"]["build"] = "node -e \"console.log('Using CI-built client/dist and server/dist')\""
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n")
          PY

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            package.json
            package-lock.json
            .deployment
            client/dist
            client/package.json
            server/dist
            server/package.json
            node_modules
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B35AD8DA12F457B9F0E2A0995CC9F26 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F9DCDAFC03C4FD3BEA0AF1D0B5BDDBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_84BE035F72454573BD6705ABB79FA6C1 }}

      # ZIP Deploy on Linux App Service runs Oryx when this setting is unset/true.
      # Ship the already-built client/dist + server/dist from CI instead.
      - name: Disable Oryx rebuild and set startup command
        run: |
          set -euo pipefail
          RG=$(az webapp list --query "[?name=='dominoGravity'].resourceGroup" -o tsv | head -n1)
          if [ -z "$RG" ]; then
            echo "Could not find App Service 'dominoGravity' in this subscription." >&2
            exit 1
          fi
          echo "Updating App Service settings in resource group $RG"
          az webapp config appsettings set \
            --name dominoGravity \
            --resource-group "$RG" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false
          az webapp config set \
            --name dominoGravity \
            --resource-group "$RG" \
            --startup-file "node server/dist/server.js"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dominoGravity'
          slot-name: 'Production'
          package: .
          startup-command: 'node server/dist/server.js'
