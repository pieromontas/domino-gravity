# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - dominoGravity

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      # Do not set NODE_ENV=production here. npm ci omits workspace
      # devDependencies (typescript, vite, vitest, @types/*) when NODE_ENV is
      # production, which is what broke tsc after PR #4.
      - name: npm ci, build, and test
        env:
          VITE_DISCORD_CLIENT_ID: ${{ secrets.VITE_DISCORD_CLIENT_ID }}
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Prune to production dependencies
        run: npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            package.json
            package-lock.json
            client/dist
            client/package.json
            server/dist
            server/package.json
            node_modules
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B35AD8DA12F457B9F0E2A0995CC9F26 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5F9DCDAFC03C4FD3BEA0AF1D0B5BDDBC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_84BE035F72454573BD6705ABB79FA6C1 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dominoGravity'
          slot-name: 'Production'
          package: .
